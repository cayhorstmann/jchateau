# ---------------------------------------------------------------------------
# Quarkus Chicory – markdown.wasm module configuration
# ---------------------------------------------------------------------------

# The markdown-wasm binary is on the classpath at src/main/resources/markdown.wasm.
# Its name property declares the Java class that quarkus-chicory generates at build time.
quarkus.chicory.modules.markdown.wasm-resource=markdown.wasm
quarkus.chicory.modules.markdown.name=io.jchateau.MarkdownModule

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."io.jchateau".level=DEBUG
