# ---------------------------------------------------------------------------
# Quarkus Chicory – pandoc.wasm module configuration
# ---------------------------------------------------------------------------

# Path to the pandoc.wasm binary on the classpath.
# The file must be placed at src/main/resources/pandoc.wasm before building.
# See README.md for download instructions.
quarkus.chicory.modules.pandoc.wasm-file=pandoc.wasm

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.port=8080

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."io.jchateau".level=DEBUG
